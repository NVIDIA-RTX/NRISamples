name: NRI samples
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  Build-Windows:
    runs-on: windows-latest
    steps:
      - name : Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy
        run: .\Scripts\Windows\1-Deploy.bat

      - name: Build
        run: .\Scripts\Windows\2-Build.bat

  Build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name : Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Deploy
        run: bash Scripts/Linux/1-Deploy.sh

      - name: Build
        run: bash Scripts/Linux/2-Build.sh

  Build-macOS:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Install dependencies
        run: brew install ninja

      - name: Setup Vulkan SDK
        run: |
          version=$(curl --fail --silent --show-error --location --retry 3 https://vulkan.lunarg.com/sdk/latest/mac.txt)
          sdk="$RUNNER_TEMP/VulkanSDK/macOS"
          echo "VULKAN_SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "DYLD_LIBRARY_PATH=$sdk/lib/VulkanLoader/lib:$sdk/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/VulkanSDK
          key: vulkan-sdk-macos-${{ runner.arch }}-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/mac/vulkansdk-macos-$VULKAN_SDK_VERSION.zip" \
            --output "$RUNNER_TEMP/vulkan-sdk.zip"
          unzip -q "$RUNNER_TEMP/vulkan-sdk.zip" -d "$RUNNER_TEMP/vulkan-installer"
          installer="vulkansdk-macOS-$VULKAN_SDK_VERSION"
          sudo "$RUNNER_TEMP/vulkan-installer/$installer.app/Contents/MacOS/$installer" \
            --root "$RUNNER_TEMP/VulkanSDK" --accept-licenses --default-answer --confirm-command install

      - name: Deploy
        run: bash Scripts/MacOS/1-Deploy.sh

      - name: Build
        run: bash Scripts/MacOS/2-Build.sh
